name: Validate OCKER
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci
      - run: npm test && npm run check:spec && npm run build && npm run demo:build
      - run: npx playwright install --with-deps chromium
      - run: node node_modules/@playwright/test/cli.js test -c ri/js/playwright.config.js
      - run: npm run build --workspace=@ocker-ai/angular && npm run build --workspace=@ocker-ai/react
      - run: npm run build --workspace=@ocker-ai/angular-demo && npm run build --workspace=@ocker-ai/react-demo
      - run: npm run test --workspace=@ocker-ai/node-demo && npm run build --workspace=@ocker-ai/node-demo
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode -f ri/java/pom.xml verify
  csharp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build 'ri/c#/Ocker.sln'
      - run: dotnet run --project 'ri/c#/tests/Ocker.Core.Tests/Ocker.Core.Tests.csproj' --no-build
