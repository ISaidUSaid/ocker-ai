name: Publish client-only example
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci
      - run: npm run demo:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ri/js/dist/demo
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy example
        id: deployment
        uses: actions/deploy-pages@v4
