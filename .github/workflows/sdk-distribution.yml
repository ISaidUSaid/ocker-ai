name: Prepare private SDK distribution
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: npm ci
      - run: npm test && npm run check:spec
      - run: npm run sdk:distribution
      - run: npm run test:consumers:web
      - run: npm run test:consumers:java
      - run: npm run test:consumers:dotnet
      - uses: actions/upload-artifact@v4
        with:
          name: ocker-sdk-private-${{ github.sha }}
          path: |
            .work/distribution/*.tar.gz
            .work/distribution/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
